<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151c2c"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="5" y="5" width="54" height="54" rx="12" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.85"/>
  <text x="32" y="45" font-family="'Source Serif 4', 'Noto Serif Devanagari', serif" font-size="34" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">भा</text>
